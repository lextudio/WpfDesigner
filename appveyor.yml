  branches:
    only:
      - master

  version: 8.0.{build}
  
  image: Visual Studio 2019
  
  configuration: Release
 
  assembly_info:
    patch: true
    file: GlobalAssemblyInfo.*
    assembly_version: '{version}'
    assembly_file_version: '{version}'
    assembly_informational_version: '{version}'

  before_build:
    - nuget restore

  build:
    project: WpfDesign.sln

  after_build:
    - ps: .\nuget\pack.ps1

  test_script:
    - cmd: dotnet test WpfDesign.Designer\Tests\WpfDesign.Tests.csproj --configuration Release --nologo --logger "trx;LogFileName=test-results.trx"

  artifacts:
    - path: 'ICSharpCode.WpfDesigner.*.nupkg'
      name: NuGet
